<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Captain Whiskers: Moon Base Mission (v13)</title>
<style>
  :root {
    --card: #f3eefc;
    --ink: #2a1f47;
    --cat: #f39a3d;
    --shield: #7cc8ff;
    --good: #2f8f5e;
    --bad: #c9485b;
    --unk: #7a6f96;
    --rib: 56px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #140f2e; overflow: hidden; }
  body { font-family: "Chalkboard SE", "Trebuchet MS", "Segoe UI", sans-serif; color: var(--ink); }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

  #hud { position: fixed; top: calc(var(--rib) + 8px); left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #fff; font-size: 16px; pointer-events: none; }
  #trip { flex: 1; max-width: 240px; }
  #trip .track { height: 10px; border-radius: 6px; background: rgba(255,255,255,0.18); margin-top: 5px; overflow: hidden; }
  #trip .fill { height: 100%; width: 0; background: var(--cat); border-radius: 6px; }
  #shield { display: inline-flex; align-items: center; gap: 4px; }
  #shield i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--shield); display: inline-block; }
  #shield i.on { background: var(--shield); }
  #toast { position: fixed; z-index: 25; top: calc(var(--rib) + 44px); left: 12px; right: 12px; max-width: 560px; margin: 0 auto; text-align: center; color: #fff; font-size: 17px; line-height: 1.4; background: rgba(20, 15, 46, 0.82); border-radius: 14px; padding: 8px 12px; pointer-events: none; opacity: 0; transition: opacity 0.3s; }

  #overlay { position: fixed; inset: var(--rib) 0 0 0; display: flex; align-items: flex-start; justify-content: center; padding: 16px; background: rgba(20, 15, 46, 0.55); overflow-y: auto; touch-action: pan-y; }
  .card { background: var(--card); border-radius: 22px; padding: 20px 18px; width: 100%; max-width: 480px; margin: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.35); }
  .card.wide { max-width: 1040px; }
  .card h1 { font-size: 28px; line-height: 1.15; margin-bottom: 10px; }
  .card h2 { font-size: 24px; margin-bottom: 8px; }
  .card h3 { font-size: 20px; }
  .card p { font-size: 17px; line-height: 1.5; margin-bottom: 12px; }
  .card ul { margin: 0 0 14px 20px; font-size: 16px; line-height: 1.5; }
  .resbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .pill { background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 16px; font-weight: bold; }
  .planets { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
  .pcard { background: #fff; border-radius: 16px; padding: 14px; }
  .pcard.here { outline: 3px solid var(--cat); }
  .phead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .dot { width: 40px; height: 40px; border-radius: 50%; flex: none; }
  .tag { font-size: 13px; background: #ece5fb; border-radius: 999px; padding: 2px 8px; margin-left: 4px; }
  .facts { font-size: 15px; margin-bottom: 10px; }
  details { border-bottom: 1px solid #eee7fa; padding: 5px 0; }
  summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
  summary::-webkit-details-marker { display: none; }
  summary .q { flex: none; width: 22px; height: 22px; border-radius: 50%; background: #ddd3f0; text-align: center; font-size: 14px; line-height: 22px; }
  details p { font-size: 15px !important; margin: 6px 0 2px !important; color: #4a3f6b; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 14px; margin-bottom: 10px; }
  .chk { border-radius: 8px; padding: 5px 7px; background: #f1eef7; color: var(--unk); }
  .chk.yes { background: #e0f3e8; color: var(--good); }
  .chk.no { background: #fbe4e7; color: var(--bad); }
  .cost { font-size: 15px; margin-bottom: 6px; }
  .btn { display: block; width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 14px; border: none; background: var(--cat); color: var(--ink); cursor: pointer; margin-top: 8px; }
  .btn.alt { background: #ddd3f0; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn:focus-visible, summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .fun { background: #fff; border-radius: 14px; padding: 12px 14px; }
  .note { font-size: 15px !important; color: #5a4f7a; }
  .stars { font-size: 38px; letter-spacing: 4px; margin-bottom: 8px; }
  .hidden { display: none !important; }
  #caption { position: fixed; left: 12px; right: 12px; bottom: 14px; margin: 0 auto; max-width: 620px; background: var(--card); border-radius: 20px; padding: 16px 18px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  #caption p { font-size: 19px; line-height: 1.45; margin-bottom: 10px; min-height: 3em; }
  #caption .row, .card .row { display: flex; gap: 8px; }
  #caption .row .btn, .card .row .btn { margin-top: 0; }
  .steps { font-size: 14px; color: #6a5f8a; margin-bottom: 6px; }
  .pics { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; background: #fff; border-radius: 14px; padding: 10px; margin-bottom: 12px; }
  .pics figure { text-align: center; font-size: 13px; width: 72px; }
  .pics img { width: 56px; height: 56px; display: block; margin: 0 auto 2px; }
  .tips li { margin-bottom: 6px; }
  .hintbox { background: #fff6dc; border-left: 5px solid #f3b53d; border-radius: 10px; padding: 10px 12px; font-size: 16px; margin-bottom: 10px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .toolbar .btn { width: auto; flex: 1; min-width: 140px; margin-top: 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tab { font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 12px; border: none; background: #fff; color: var(--ink); cursor: pointer; flex: 1; min-width: 96px; }
  .tab.on { background: var(--ink); color: #fff; }
  .tab:focus-visible, .opt:focus-visible, .inp:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .qbox { background: #fff; border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .ql { display: block; font-size: 17px; font-weight: bold; margin-bottom: 8px; }
  .inp { width: 100%; font: inherit; font-size: 17px; padding: 10px; border-radius: 10px; border: 2px solid #ddd3f0; color: var(--ink); background: #fff; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { font: inherit; font-size: 15px; padding: 8px 12px; border-radius: 999px; border: 2px solid #ddd3f0; background: #fff; color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .opt.on { border-color: var(--ink); background: #ece5fb; font-weight: bold; }
  .opt i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.25); display: inline-block; }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper .btn { width: 52px; margin-top: 0; }
  .stepper b { font-size: 22px; min-width: 40px; text-align: center; }
  .preview { display: block; width: 100%; max-width: 280px; margin: 0 auto 10px; border-radius: 14px; }
  #explore { position: fixed; inset: 0; pointer-events: none; }
  #explore .pt { position: absolute; transform: translate(-50%, -50%); width: 58px; height: 58px; border-radius: 50%; border: 3px solid #fff; background: rgba(255, 224, 102, 0.92); font-size: 26px; line-height: 1; padding: 0; cursor: pointer; pointer-events: auto; animation: pulse 1.3s infinite; }
  #explore .pt.done { background: rgba(255, 255, 255, 0.5); animation: none; }
  #explore .pt:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 224, 102, 0.85); } 50% { box-shadow: 0 0 0 13px rgba(255, 224, 102, 0); } }
  #exPanel { position: absolute; left: 12px; right: 12px; bottom: 14px; margin: 0 auto; max-width: 620px; background: var(--card); border-radius: 20px; padding: 12px 16px; pointer-events: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  #exPanel p { font-size: 17px; line-height: 1.4; margin-bottom: 8px; min-height: 2.8em; }
  #exPanel .btn { margin-top: 0; }
  body.big #exPanel p { font-size: 20px; }
  body.big .card p, body.big .card ul { font-size: 20px; }
  body.big .facts, body.big .cost, body.big .checks, body.big .opt, body.big .tab { font-size: 17px; }
  body.big details p, body.big .note { font-size: 18px !important; }
  body.big #caption p { font-size: 22px; }
  body.big #toast { font-size: 20px; }
  /* v9: top ribbon */
  /* v11: a bigger, brighter ribbon. Status with a progress bar on the left, a big diamond counter on the right */
  #ribbon { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding: 8px 12px; background: linear-gradient(100deg, #1b1146, #4a2591 55%, #1b1146); border-bottom: 4px solid #ffd24a; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45); color: #fff; font-size: 15px; }
  #ribbon .who { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 180px; }
  #ribbon .who img { width: 54px; height: 54px; border-radius: 50%; background: #3a2a6e; flex: none; border: 3px solid #ffd24a; }
  #ribbon .nm { min-width: 0; display: block; }
  #ribbon .who b { display: block; font-size: 17px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rbRank { display: inline-block; margin: 2px 0 4px; padding: 2px 11px; border-radius: 999px; background: linear-gradient(90deg, #ffe066, #ff9f4a); color: #2a1f47; font-weight: bold; font-size: 15px; white-space: nowrap; }
  #rbRank.pop { animation: pop 0.7s; }
  .rbar { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #ffe9a8; white-space: nowrap; }
  .rbar .track { width: 110px; height: 9px; border-radius: 6px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
  .rbar .track i { display: block; height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, #7cf0ff, #5fd4ff); transition: width 0.6s; }
  #rbGems { flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 16px 4px 10px; border-radius: 20px; border: 3px solid #7cf0ff; background: rgba(95, 212, 255, 0.2); font-size: 32px; font-weight: bold; line-height: 1.1; position: relative; }
  #rbGems .gi { font-size: 30px; display: inline-block; }
  #rbGems.pop { animation: gpop 0.6s; }
  #rbGems.pop .gi { animation: gspin 0.6s; }
  #rbGems .plus { position: absolute; right: 6px; top: 100%; font-size: 20px; color: #7cf0ff; animation: plusup 1.1s ease-out forwards; pointer-events: none; }
  @keyframes gpop { 40% { transform: scale(1.3); background: #ffe066; color: #2a1f47; } }
  @keyframes gspin { 50% { transform: rotate(-25deg) scale(1.4); } }
  @keyframes plusup { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(26px); } }
  .flygem { position: fixed; z-index: 60; font-size: 26px; pointer-events: none; transition: transform 0.75s cubic-bezier(0.5, -0.3, 0.6, 1), opacity 0.75s; will-change: transform; }
  #ribbon .stats { display: flex; flex-wrap: wrap; gap: 5px; flex: 1 1 100%; }
  @media (min-width: 760px) { #ribbon .stats { flex: 0 1 auto; order: 2; } #rbGems { order: 3; } }
  .chip { background: rgba(255, 255, 255, 0.14); border-radius: 999px; padding: 3px 9px; font-weight: bold; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .chip.pop { animation: pop 0.5s; }
  @keyframes pop { 40% { transform: scale(1.45); background: #ffd24a; color: #2a1f47; } }
  /* v9: simpler star map and galaxy picker */
  .card.mid { max-width: 640px; }
  .picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .ptile { font: inherit; font-size: 14px; line-height: 1.2; border: 3px solid transparent; background: #fff; border-radius: 14px; padding: 6px 2px; cursor: pointer; color: var(--ink); text-align: center; position: relative; min-width: 0; }
  .ptile img { width: 52px; display: block; margin: 0 auto 2px; }
  .ptile b { display: block; overflow-wrap: anywhere; }
  .ptile small { display: block; color: #6a5f8a; font-size: 13px; margin-top: 2px; }
  .ptile.on { border-color: var(--cat); box-shadow: 0 3px 0 var(--cat); }
  .ptile .badge { position: absolute; top: -7px; right: -3px; font-size: 16px; }
  .ptile:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .pbig { width: 64px; height: 64px; flex: none; }
  .sub { display: block; font-size: 16px; margin: 10px 0 4px; }
  .gcard { margin-bottom: 10px; }
  .gcard .btn { margin-top: 0; }
  .gq { width: 64px; height: 64px; flex: none; border-radius: 50%; background: #140f2e; color: #ffe066; font-size: 34px; font-weight: bold; text-align: center; line-height: 64px; }
  /* v9: knowledge star card, happy dances, new status */
  #fact { position: fixed; left: 12px; right: 12px; bottom: 14px; z-index: 20; margin: 0 auto; max-width: 620px; max-height: 56vh; overflow-y: auto; background: var(--card); border-radius: 20px; padding: 14px 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  #fact h3 { margin-bottom: 6px; }
  #fact .joke { font-size: 18px; line-height: 1.4; margin-bottom: 8px; }
  #fact .real { background: #fff; border-radius: 12px; padding: 8px 10px; font-size: 17px; line-height: 1.45; }
  #party { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(20, 15, 46, 0.75); overflow-y: auto; }
  #party .card { text-align: center; }
  #party canvas { width: 100%; max-width: 340px; height: auto; border-radius: 16px; margin: 0 auto 10px; touch-action: auto; }
  #cheer { position: fixed; left: 50%; bottom: 44%; z-index: 45; width: 220px; margin-left: -110px; pointer-events: none; text-align: center; }
  #cheer.corner { left: 12px; bottom: 16px; margin-left: 0; width: 170px; }
  #cheer .say { display: inline-block; background: #fff; color: #2a1f47; border-radius: 14px; padding: 4px 10px; font-size: 17px; font-weight: bold; margin-bottom: 4px; }
  #cheer.corner .say { font-size: 14px; }
  #cheer img { width: 88px; height: 88px; display: block; margin: 0 auto; }
  #cheer.corner img { width: 60px; height: 60px; }
  #cheer .gem { position: absolute; left: 50%; bottom: 40px; margin-left: -11px; font-size: 22px; opacity: 0; animation: gemfly 1.3s ease-out forwards; }
  #cheer.a-rain .gem { animation-name: gemrain; }
  @keyframes gemfly { 0% { transform: translate(0, 0) scale(0.4); opacity: 1; } 60% { transform: translate(var(--dx), -110px) scale(1.3); opacity: 1; } 100% { transform: translate(calc(var(--dx) * 1.6), -20px) scale(0.8); opacity: 0; } }
  @keyframes gemrain { 0% { transform: translate(var(--dx), -55vh); opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(var(--dx), 20px); opacity: 0; } }
  .a-jump img, .a-rain img { animation: zjump 0.4s ease-in-out 4 alternate; }
  .a-spin img { animation: zspin 0.9s ease-in-out 2; }
  .a-wiggle img { animation: zwig 0.22s ease-in-out 8 alternate; }
  .a-zoom img { animation: zzoom 1.9s ease-in-out; }
  .a-flip img { animation: zflip 0.9s ease-in-out 2; }
  @keyframes zjump { to { transform: translateY(-50px) scaleY(1.1); } }
  @keyframes zspin { to { transform: rotate(360deg); } }
  @keyframes zwig { from { transform: rotate(-18deg); } to { transform: rotate(18deg) translateY(-10px); } }
  @keyframes zzoom { 0% { transform: translateX(-70vw) rotate(-25deg); } 45%, 55% { transform: translateX(0) scale(1.3); } 100% { transform: translateX(70vw) rotate(25deg); } }
  @keyframes zflip { 50% { transform: translateY(-60px) rotate(180deg); } 100% { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #cheer img, #cheer .gem, .chip.pop { animation: none !important; opacity: 1; } }
  body.big .ql, body.big .inp { font-size: 20px; }
  /* v10: Explorer mode, boost, stardust, sound */
  .big3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .big3 .ptile { padding: 10px 4px; font-size: 17px; }
  .big3 .ptile img { width: 84%; max-width: 120px; }
  .lights { display: flex; gap: 6px; justify-content: center; margin: 6px 0 8px; flex-wrap: wrap; }
  .lt { width: 44px; height: 44px; border-radius: 50%; background: #ddd8ea; font-size: 21px; line-height: 38px; text-align: center; border: 3px solid #bdb5d3; }
  .lt.yes { background: #c9f0d8; border-color: var(--good); }
  .lt.no { background: #fbd3d8; border-color: var(--bad); }
  .guess { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .guess .btn, .yn .btn { margin-top: 0; font-size: 17px; padding: 12px 4px; }
  .guess .btn span, .yn .btn span { display: block; font-size: 34px; line-height: 1.2; }
  .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .starpic { display: block; width: 100%; max-width: 420px; margin: 0 auto 8px; border-radius: 14px; }
  .center { text-align: center; }
  .bigq { font-size: 20px !important; text-align: center; font-weight: bold; }
  .btn.go { font-size: 24px; padding: 16px; }
  .btn.say { display: inline-block; width: auto; margin: 0 0 8px; padding: 6px 12px; font-size: 15px; }
  #boost { position: fixed; right: 14px; bottom: 18px; z-index: 12; width: 92px; height: 92px; border-radius: 50%; border: 4px solid #fff; background: var(--cat); color: var(--ink); font: inherit; font-size: 15px; font-weight: bold; line-height: 1.1; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; opacity: 0.92; }
  #boost.on { transform: scale(1.12); background: #ffe066; }
  #boost span { display: block; font-size: 30px; }
  #bits { font-weight: bold; font-size: 17px; }
  #exPanel .lights { margin: 0 0 4px; gap: 4px; }
  #exPanel .lt { width: 30px; height: 30px; font-size: 15px; line-height: 25px; border-width: 2px; }
  #rbSound { border: none; font: inherit; font-weight: bold; color: #fff; cursor: pointer; }
  /* v11: Zib cards with small cartoons, the journey map, the rover, steps */
  .ctoon { display: block; width: 100%; max-width: 480px; height: auto; margin: 0 auto 8px; border-radius: 16px; background: #140f2e; touch-action: auto; }
  .zsay { display: flex; align-items: flex-start; gap: 8px; margin: 0 0 10px; }
  .zsay img { width: 56px; height: 56px; flex: none; }
  .zsay p { flex: 1; margin: 0 !important; background: #fff; border-radius: 4px 16px 16px 16px; padding: 9px 12px; font-size: 18px !important; line-height: 1.35 !important; }
  .zsay .sayb { flex: none; width: 40px; height: 40px; border-radius: 50%; border: none; background: #ddd3f0; font-size: 18px; cursor: pointer; }
  .steps3 { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 8px; font-size: 14px; color: #6a5f8a; }
  .steps3 span { padding: 3px 10px; border-radius: 999px; background: #e6def6; white-space: nowrap; }
  .steps3 span.on { background: var(--ink); color: #fff; font-weight: bold; }
  .more summary { justify-content: center; color: #6a5f8a; font-size: 15px; }
  .prog { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 14px; padding: 8px 12px; margin: 0 0 10px; font-size: 16px; }
  .prog .track { flex: 1; height: 12px; border-radius: 8px; background: #e6def6; overflow: hidden; }
  .prog .track i { display: block; height: 100%; border-radius: 8px; background: var(--cat); }
  .jrow { background: #fff; border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; border: 3px solid transparent; }
  .jrow.here { border-color: var(--cat); }
  .jrow.locked { opacity: 0.6; }
  .jhead { display: flex; align-items: center; gap: 10px; }
  .jhead img, .jhead .gq { width: 52px; height: 52px; line-height: 52px; font-size: 28px; flex: none; }
  .jhead h3 { flex: 1; font-size: 18px; line-height: 1.2; }
  .jhead h3 small { display: block; font-size: 13px; font-weight: normal; color: #6a5f8a; }
  .jhead .btn { width: auto; margin: 0; padding: 9px 12px; font-size: 16px; white-space: nowrap; }
  .jpl { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .jp { width: 34px; height: 34px; border-radius: 50%; border: none; padding: 0; background: #e6def6; color: #9a8fb8; font: inherit; font-size: 15px; font-weight: bold; position: relative; cursor: pointer; }
  .jp img { width: 34px; height: 34px; display: block; }
  .jp .h { position: absolute; right: -4px; bottom: -4px; font-size: 13px; }
  .jsum { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .row2 .btn { margin-top: 0; }
  #rove { position: fixed; inset: 0; z-index: 11; pointer-events: none; }
  #rove > * { pointer-events: auto; }
  #rvTop { position: absolute; top: calc(var(--rib) + 8px); left: 10px; right: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #rvLights { background: rgba(243, 238, 252, 0.94); border-radius: 999px; padding: 4px 8px; }

  { name: 'Diamondia', gal: 'andro', c1: '#e8f6ff', c2: '#7aa0c8', look: 'sparkle', g: 1.8, star: 'yellow', sd: 1, day: '18 hours', size: 'super', note: 'Sparkles like a jewel!',

  { id: 'prints', title: '👣 Moon footprints', fact: 'Astronaut footprints on the Moon can last millions of years, because there\'s no wind or rain to wash them away.' },
  // ===== v12: 50 more real facts, from gravity to galaxies. g = group, j = Zib's joke, cap = label for the little cartoon, q = quiz question, a = answers (the right answer is always first; the game shuffles them) =====
  { id: "gravity", g: "grav", title: "🍎 Gravity pulls", fact: "Gravity is a pull. Earth pulls on you, so you always come back down when you jump. The Sun's gravity keeps all the planets going around it.", j: "I jumped as high as I could. Gravity said: come back down! Gravity always wins.", cap: "Everything falls down!", q: "What keeps the planets going around the Sun?", a: ["The Sun's gravity", "Strong winds", "Giant ropes"] },
  { id: "moonjump", g: "grav", title: "🌙 Super jumps on the Moon", fact: "The Moon's gravity is much weaker than Earth's. On the Moon, you would weigh about 6 times less, so you could jump much, much higher!", j: "On the Moon I jumped over my rocket. Then I waited... and waited... to come down.", cap: "Boing! So high!", q: "Where could you jump much higher?", a: ["On the Moon", "On Earth", "On Jupiter"] },
  { id: "jupiterheavy", g: "grav", title: "🏋️ Heavy on Jupiter", fact: "Jupiter's gravity is about 2 and a half times as strong as Earth's. A cat that weighs 10 pounds at home would feel like 25 pounds there!", j: "On Jupiter I felt so heavy. I needed a nap after every step.", cap: "Oof! So heavy!", q: "On which planet would you feel the heaviest?", a: ["Jupiter", "Mars", "Pluto"] },
  { id: "floaty", g: "grav", title: "🧑‍🚀 Why astronauts float", fact: "Astronauts on the Space Station float because they and their station are falling around Earth together, all the time. Gravity is still there!", j: "I tried to pour juice on the Space Station. It made a floating juice ball. I slurped it like a bubble!", cap: "Falling around Earth!", q: "Is there gravity on the Space Station?", a: ["Yes, they are falling around Earth", "No, there isn't any", "Only on Tuesdays"] },
  { id: "tides", g: "grav", title: "🌊 The Moon pulls the sea", fact: "The Moon's gravity pulls on Earth's oceans. That makes the tides: the sea comes up the beach and goes back out, about twice a day.", j: "I built a sandcastle by the sea. The Moon took it. Rude!", cap: "The Moon tugs the ocean", q: "What makes the ocean tides?", a: ["The Moon's gravity", "Whales splashing", "The wind"] },
  { id: "round", g: "grav", title: "🥔 Why planets are round", fact: "Big things in space are round because their own gravity pulls them into a ball. Small asteroids have weak gravity, so many are lumpy, like potatoes!", j: "I found an asteroid shaped like a potato. I did NOT put butter on it.", cap: "Big = round, small = lumpy", q: "Why are big planets round?", a: ["Their gravity pulls them into a ball", "Someone rolled them", "They are balloons"] },
  { id: "sunstar", g: "stars", title: "☀️ The Sun is a star", fact: "The Sun is a star, just like the stars you see at night. It looks big and bright because it is much, much closer to us.", j: "Hello, Sun! You are a star! Can I have your autograph?", cap: "Our very own star!", q: "What is the Sun?", a: ["A star", "A planet", "A giant light bulb"] },
  { id: "bigsun", g: "stars", title: "🟡 A giant Sun", fact: "The Sun is so big that more than 1 million Earths could fit inside it!", j: "I tried to fill the Sun with Earths. I got bored after 12.", cap: "1 million Earths inside!", q: "About how many Earths could fit inside the Sun?", a: ["More than 1 million", "About 10", "About 100"] },
  { id: "starcolors", g: "stars", title: "🌈 Stars come in colors", fact: "Stars come in colors! Red stars are the coolest. Blue stars are the hottest. Our Sun is in the middle.", j: "Blue means HOT? On a faucet, blue means cold! Stars are so confusing.", cap: "Red = cool, blue = hot", q: "Which stars are the hottest?", a: ["Blue stars", "Red stars", "Green stars"] },
  { id: "nebula", g: "stars", title: "☁️ Star nurseries", fact: "New stars are born in giant clouds of gas and dust called nebulas. Some nebulas are so big that light takes years to cross them!", j: "A star nursery! Do baby stars cry? No. They just shine. Lucky parents.", cap: "Baby stars are born here", q: "Where are new stars born?", a: ["In giant clouds called nebulas", "Inside the Moon", "In black holes"] },
  { id: "supernova", g: "stars", title: "💥 A supernova", fact: "When a giant star runs out of fuel, it can explode. This is called a supernova. For a little while, it can shine brighter than a whole galaxy!", j: "KA-BOOM! That star went out with a really, really big bang.", cap: "KA-BOOM!", q: "What is a supernova?", a: ["A giant star exploding", "A brand-new planet", "A super fast comet"] },
  { id: "stardustus", g: "stars", title: "✨ You are made of stardust", fact: "Lots of the stuff in your body, like the iron in your blood, was made inside stars a long, long time ago. You are made of stardust!", j: "You are made of stardust. So am I! We are space cousins!", cap: "Made inside old stars", q: "Where was the iron in your blood made?", a: ["Inside stars, long ago", "In a factory", "In the ocean"] },
  { id: "proxima", g: "stars", title: "🔭 Our nearest star friend", fact: "After the Sun, the closest star to us is Proxima Centauri. Its light takes more than 4 years to get here!", j: "I waved at Proxima Centauri. It will see my wave in 4 years!", cap: "More than 4 years away", q: "How long does light from Proxima Centauri take to reach us?", a: ["More than 4 years", "8 minutes", "1 second"] },
  { id: "moresand", g: "stars", title: "🏖️ More stars than sand", fact: "Scientists think there are more stars in the universe than grains of sand on all of Earth's beaches!", j: "I started counting the sand at the beach. Then I remembered the stars. I went home.", cap: "So many stars!", q: "Which is there more of?", a: ["Stars in the universe", "Sand on Earth's beaches", "Cats on Earth"] },
  { id: "twinkle", g: "stars", title: "⭐ Why stars twinkle", fact: "Stars twinkle because the air around Earth is always moving, and it wiggles their light. Out in space, stars do not twinkle at all!", j: "Twinkle, twinkle, little star... oh. It is just the wobbly air. Still pretty!", cap: "Wobbly air = twinkle", q: "Why do stars twinkle?", a: ["Earth's moving air wiggles their light", "They blink on purpose", "They are sleepy"] },
  { id: "neutron", g: "stars", title: "🧲 A neutron star", fact: "A neutron star is the tiny leftover of a giant star that exploded. It is about as wide as a city, but one spoonful of it would weigh as much as a mountain!", j: "I tried to lift a spoonful of neutron star. My arms said: nope.", cap: "A spoonful = a mountain!", q: "How wide is a neutron star?", a: ["About as wide as a city", "Bigger than the Sun", "As small as a pea"] },
  { id: "sunfuture", g: "stars", title: "🔴 The Sun will grow old", fact: "In about 5 billion years, our Sun will puff up into a huge red giant star. Do not worry: that is a very, very long time from now!", j: "5 billion years! I will need a LOT of birthday candles.", cap: "Puff! A red giant", q: "What will the Sun become in about 5 billion years?", a: ["A red giant star", "A black hole", "A planet"] },
  { id: "constell", g: "stars", title: "🌟 Constellations", fact: "A constellation is a group of stars that people imagined as a picture, like a hunter, a bear, or a swan. Scientists use 88 of them to map the sky.", j: "I made my own constellation. It is called The Zib. It looks like a pizza.", cap: "Connect the dots!", q: "What is a constellation?", a: ["A picture people imagined in the stars", "A kind of planet", "A space rocket"] },
  { id: "bigdipper", g: "stars", title: "🥄 The Big Dipper", fact: "The Big Dipper is 7 bright stars that look like a giant spoon. They are part of a constellation called the Great Bear.", j: "A giant spoon in the sky! Where is the giant cereal bowl?", cap: "A spoon made of stars", q: "What does the Big Dipper look like?", a: ["A giant spoon", "A cat", "A car"] },
  { id: "northstar", g: "stars", title: "🧭 The North Star", fact: "The North Star, called Polaris, stays in almost the same spot in our sky all night. For hundreds of years, sailors used it to find which way is north.", j: "I asked the North Star for directions. It just pointed north. Every time.", cap: "It points north!", q: "How did sailors use the North Star?", a: ["To find which way is north", "To cook dinner", "To catch fish"] },
  { id: "orion", g: "stars", title: "🏹 Orion the Hunter", fact: "Orion is a constellation shaped like a hunter. Three bright stars in a row make the hunter's belt. You can spot them on winter evenings.", j: "The hunter has a belt made of stars. My belt is made of string.", cap: "3 stars = a belt", q: "What shape is the Orion constellation?", a: ["A hunter", "A fish", "A teapot"] },
  { id: "shooting", g: "rocks", title: "🌠 Shooting stars", fact: "A shooting star is not a star at all! It is a tiny piece of space rock, often smaller than a pea, burning up as it zooms into the air.", j: "I made a wish on a shooting star. It was a pebble. Does my wish still count?", cap: "A tiny rock, burning up", q: "What is a shooting star really?", a: ["A tiny space rock burning up", "A star falling down", "A firework"] },
  { id: "halley", g: "rocks", title: "☄️ Halley's Comet", fact: "Halley's Comet comes back near Earth about every 76 years. Its next visit is in 2061. How old will you be?", j: "Halley visits every 76 years. That is a very slow friend.", cap: "See you in 2061!", q: "About how often does Halley's Comet come back?", a: ["Every 76 years", "Every week", "Never"] },
  { id: "belt", g: "rocks", title: "🪨 The asteroid belt", fact: "Between Mars and Jupiter there are millions of space rocks called asteroids. They are so far apart that spaceships fly through safely!", j: "In movies, asteroid belts are crowded. In real life, they are very empty. Boring, but safe!", cap: "Lots of room in between", q: "Where is the asteroid belt?", a: ["Between Mars and Jupiter", "Inside the Sun", "Around the Moon"] },
  { id: "cometice", g: "rocks", title: "❄️ Giant comet tails", fact: "A comet is small, but when it gets near the Sun, its ice turns into gas. Then its tail can stretch for millions of miles!", j: "A tiny comet with a tail millions of miles long. That is a LOT of tail to wag.", cap: "The ice turns to gas", q: "What happens to a comet near the Sun?", a: ["Its ice turns to gas and makes a tail", "It turns into a star", "It goes to sleep"] },
  { id: "crater", g: "rocks", title: "🕳️ Moon craters", fact: "The Moon is covered in holes called craters. Space rocks crashed into it long ago. With no wind or rain, the holes are still there.", j: "The Moon has so many holes. It looks like Swiss cheese. It is NOT cheese. I checked.", cap: "Crash! Crash! Crash!", q: "What made the Moon's craters?", a: ["Space rocks crashing into it", "Moon mice", "Volcanoes on Earth"] },
  { id: "goldilocks", g: "life", title: "🥣 The Goldilocks zone", fact: "Around every star there is a \"just right\" zone. Planets there are not too hot and not too cold, so water can stay liquid.", j: "Not too hot, not too cold. Just like my soup. And my bath.", cap: "Not too hot, not too cold", q: "What can stay liquid in the Goldilocks zone?", a: ["Water", "Rock", "Sunlight"] },
  { id: "needwater", g: "life", title: "💧 Life needs water", fact: "Every living thing we know needs water: plants, animals, and even tiny germs. That is why scientists look for water on other worlds.", j: "I need water too. Mostly for my bubble bath.", cap: "No water, no life we know", q: "Why do scientists look for water on other worlds?", a: ["All life we know needs water", "To go swimming", "To make clouds"] },
  { id: "europa", g: "life", title: "🧊 An ocean under the ice", fact: "Jupiter's moon Europa has a salty ocean hidden under its ice. A spacecraft called Europa Clipper is on its way there to learn more!", j: "An ocean under the ice! I brought my swimsuit. And a very big drill.", cap: "A hidden ocean", q: "What is hiding under Europa's ice?", a: ["A salty ocean", "A cave of gold", "Nothing at all"] },
  { id: "marswater", g: "life", title: "🏜️ Mars had rivers", fact: "Long ago, Mars had rivers and lakes. Today its water is frozen into ice, at the poles and under the ground.", j: "Mars used to have lakes. Now it has dust. I want a refund.", cap: "Water, then ice", q: "Where is Mars' water today?", a: ["Frozen as ice", "In big oceans", "Falling as rain"] },
  { id: "exoplanets", g: "life", title: "🪐 Planets around other stars", fact: "Scientists have found more than 6,000 planets around other stars! They are called exoplanets, and scientists keep finding new ones.", j: "More than 6,000 planets! I want to visit them all. Pack snacks!", cap: "6,000 and counting!", q: "What do we call planets around other stars?", a: ["Exoplanets", "Asteroids", "Moons"] },
  { id: "trappist", g: "life", title: "7️⃣ A family of 7 planets", fact: "A small red star called TRAPPIST-1 has 7 rocky planets about the size of Earth. A few of them are in the \"just right\" zone!", j: "Seven planets! That is one for every day of the week.", cap: "7 planets, 1 small star", q: "How many planets go around TRAPPIST-1?", a: ["7", "1", "100"] },
  { id: "onlylife", g: "life", title: "🌍 Only one home so far", fact: "So far, Earth is the only place where we have found life. Scientists are still looking: on Mars, on icy moons, and around other stars.", j: "Hello? Anybody out there? ... Oh right, I am a pretend alien!", cap: "Still looking!", q: "Where have scientists found life so far?", a: ["Only on Earth", "On Mars", "On the Sun"] },
  { id: "titan", g: "life", title: "🌧️ Titan's strange rain", fact: "Saturn's moon Titan has rain, rivers, and lakes. But they are not water! They are made of methane, which turns liquid when it is super cold.", j: "The rain on Titan is not water. Do not drink it. Do not even bring a cup.", cap: "Lakes, but not water!", q: "What are Titan's lakes made of?", a: ["Methane", "Water", "Lemonade"] },
  { id: "blackhole", g: "big", title: "⚫ What is a black hole?", fact: "A black hole is a place where gravity is so strong that nothing can get out, not even light. That is why it looks black.", j: "I asked a black hole to give back my sock. Nothing comes out. Not even socks.", cap: "Not even light escapes", q: "What can escape from a black hole?", a: ["Nothing, not even light", "Only light", "Only cats"] },
  { id: "bhpicture", g: "big", title: "📸 A picture of a black hole", fact: "In 2019, scientists showed the first picture of a black hole. It looked like a glowing orange ring, like a donut!", j: "A black hole that looks like a donut. Now I am hungry.", cap: "A glowing ring!", q: "What did the first black hole picture look like?", a: ["A glowing ring", "A black square", "A smiley face"] },
  { id: "lightspeed", g: "big", title: "⚡ The fastest thing", fact: "Light is the fastest thing there is. In just one second, it could zoom around Earth about 7 times!", j: "I raced light. Light won. Light always wins. Light is a show-off.", cap: "7 times around in 1 second!", q: "What is the fastest thing in the universe?", a: ["Light", "A rocket", "A cheetah"] },
  { id: "silent", g: "big", title: "🤫 Space is silent", fact: "Sound needs air to travel. Space has almost no air, so it is silent. A big explosion in space would make no sound at all!", j: "I yelled HELLO in space. Nobody heard. Not even me.", cap: "No air, no sound", q: "Why is space silent?", a: ["There is no air to carry sound", "Everyone is asleep", "The stars are shy"] },
  { id: "milkyname", g: "big", title: "🥛 Why the Milky Way?", fact: "On a very dark night, our galaxy looks like a pale, milky stripe across the sky. That is how it got its name!", j: "The Milky Way is not made of milk. I brought cookies for nothing.", cap: "A milky stripe of stars", q: "Why is our galaxy called the Milky Way?", a: ["It looks like a milky stripe in the sky", "It is made of milk", "Cows live there"] },
  { id: "galaxyhug", g: "big", title: "💫 Galaxies might bump", fact: "The Andromeda Galaxy and our Milky Way are moving toward each other. Billions of years from now, they might crash and join into one giant galaxy. Scientists are still checking if it will really happen!", j: "A galaxy crash! Do not worry. The stars are so far apart that they would almost never bump.", cap: "Two galaxies, one hug", q: "What might happen to Andromeda and the Milky Way one day?", a: ["They might join into one galaxy", "They will turn into planets", "They will melt"] },
  { id: "darkmatter", g: "big", title: "🙈 Invisible stuff", fact: "Most of the stuff in the universe is invisible! Scientists call it dark matter. They know it is there because its gravity pulls on stars, but nobody knows what it is yet.", j: "Invisible stuff everywhere? Is that why I keep tripping?", cap: "Hidden, but it pulls!", q: "How do scientists know dark matter is there?", a: ["Its gravity pulls on stars", "They can see it glow", "It makes noise"] },
  { id: "bluesunset", g: "big", title: "💙 Blue sunsets on Mars", fact: "On Earth, sunsets are orange and red. On Mars, sunsets look blue! The fine Mars dust spreads the sunlight in a different way.", j: "A blue sunset! Mars does everything differently.", cap: "Mars sunsets are blue", q: "What color are sunsets on Mars?", a: ["Blue", "Green", "Purple"] },
  { id: "moonlight", g: "big", title: "🌕 Moonlight is sunlight", fact: "The Moon does not make its own light. It shines because sunlight bounces off it.", j: "The Moon is borrowing the Sun's light. I hope it says thank you.", cap: "Sunlight bounces off!", q: "Why does the Moon shine?", a: ["Sunlight bounces off it", "It has lamps inside", "It is on fire"] },
  { id: "moonphase", g: "big", title: "🌓 Does the Moon change shape?", fact: "The Moon seems to change shape every month. But it is always round! We just see different amounts of its sunny side.", j: "I thought someone was taking bites out of the Moon. Nope! Just shadows.", cap: "Always round!", q: "Does the Moon really change shape?", a: ["No, we see different sunny parts", "Yes, it shrinks", "Yes, mice nibble it"] },
  { id: "hexagon", g: "big", title: "🌀 A six-sided storm", fact: "At Saturn's north pole there is a giant storm shaped like a hexagon, with 6 sides. It is wider than Earth!", j: "A storm with 6 sides! Even the weather on Saturn likes shapes.", cap: "A storm with 6 sides", q: "What shape is the storm at Saturn's north pole?", a: ["A hexagon with 6 sides", "A circle", "A star"] },
  { id: "spacesmell", g: "big", title: "👃 Space smells funny", fact: "Astronauts say that after a spacewalk, their suits smell a bit like burnt steak or hot metal!", j: "Burnt steak? Now I am hungry AND confused.", cap: "Sniff sniff!", q: "What do astronauts say space smells like?", a: ["Burnt steak or hot metal", "Flowers", "Popcorn"] },
  { id: "sunrises", g: "big", title: "🌅 16 sunrises a day", fact: "The Space Station zooms around Earth about 16 times every day. So the astronauts can see about 16 sunrises and 16 sunsets every day!", j: "16 sunrises a day! When do they eat breakfast?", cap: "Zoom! Another sunrise!", q: "How many sunrises can Space Station astronauts see in one day?", a: ["About 16", "Just 1", "None"] },
  { id: "firststeps", g: "big", title: "👣 First steps in space", fact: "Yuri Gagarin was the first person in space, in 1961. Just 8 years later, in 1969, astronauts walked on the Moon!", j: "Only 8 years from the first space trip to the Moon. That is faster than I clean my room!", cap: "1961 space, 1969 Moon!", q: "When did people first walk on the Moon?", a: ["1969", "1869", "2020"] },
  { id: "venusbright", g: "big", title: "💡 The brightest dot", fact: "Often the brightest dot in the night sky, after the Moon, is not a star at all. It is the planet Venus!", j: "People call Venus the evening star. It is not a star! Venus is just showing off.", cap: "That bright dot is Venus!", q: "What is often the brightest dot in the night sky after the Moon?", a: ["The planet Venus", "The North Star", "A satellite"] },
  { id: "aurora", g: "big", title: "🌌 Northern lights", fact: "The northern lights happen when tiny bits from the Sun hit the air high above Earth and make it glow green, pink, and purple.", j: "The sky is having a dance party! And the Sun brought the glow sticks.", cap: "The sky glows!", q: "What makes the northern lights glow?", a: ["Bits from the Sun hit the air", "Giant flashlights", "Fireflies"] },
];

function tempHint(p) {

  const g = tempGuess(p);
  return `${p.name} is "${DIST[p.sd].toLowerCase()}" to ${s}. So it's probably ${g === 'right' ? 'just right: not too hot, not too cold' : g === 'hot' ? 'too hot' : 'too cold'}.`;
}
function buildHints() {
  const out = [];
  if (G.at !== null) {
    const p = G.planets[G.at], n = score(p);
    if (n === 6) out.push(`${p.name} checks every box! Building the colony here would be a great choice.`);
    else if (n === 5) out.push(`${p.name} is a good home with one problem. If you have enough fuel and days, you could look for a better planet, or build here to be safe.`);
    else out.push(`${p.name} has lots of ✗ marks. Try to fly to another planet if you can.`);
  }
  G.planets.forEach((p, i) => {
    if (i === G.at || G.visited.has(i)) return;
    const bad = CHECKS.filter(([k]) => known(p, i, k) && !p.checks[k][0]).map(([, l]) => l.toLowerCase());
    if (bad.length) out.push(`${p.name} has a ✗ for ${bad.join(' and ')}. That's a problem for a colony.`);
    if (!G.probed.has(i)) out.push(tempHint(p));
    if (p.size === 'giant') out.push(`${p.name} is a giant planet. Giant planets are usually made of gas. Will there be any ground to stand on?`);
    if (p.dayType === 'fast') out.push(`A day on ${p.name} is only ${p.day}! Spinning that fast can stir up wild storms.`);
    if (isHeavy(p)) out.push(`${p.name} has heavy gravity (${p.g}× Earth). That's squishy for cats, and it costs 1 extra fuel to leave.`);
  });
  out.push('Even a planet that looks perfect can hide surprises. "Safe and calm" is only known when you land!');
  const unprobed = G.planets.some((p, i) => i !== G.at && !G.probed.has(i) && !G.visited.has(i));
  if (unprobed && G.fuel >= 1) out.push('Not sure? A robot probe costs just 1 fuel and checks the ground, water, air, and temperature.');
  out.push(`You have ⛽ ${G.fuel} fuel and 📅 ${G.days} days. Before you fly, check that you'll still have enough to reach the planet you like best.`);
  return out;
}

function spawnObstacle(z) {
  const speed = 170 + Math.random() * 70;
  const kind = z === 1 ? (Math.random() < 0.9 ? 'rock' : 'alien') : z === 2 ? (Math.random() < 0.6 ? 'comet' : 'alien') : z === 3 ? rand(['rock', 'alien', 'comet']) : (Math.random() < 0.7 ? 'rock' : 'alien');
  if (kind === 'alien') {
    obs.push({ type: 'alien', bx: 30 + Math.random() * (W - 60), x: 0, y: -30, r: 18, vy: speed * 0.8, ph: Math.random() * 6, amp: 30 + Math.random() * 40 });
  } else if (kind === 'comet') {
    const left = Math.random() < 0.5;
    obs.push({ type: 'comet', x: left ? -20 : W + 20, y: Math.random() * H * 0.3, vx: (left ? 1 : -1) * (110 + Math.random() * 120), vy: 250 + Math.random() * 80, r: 12, ph: 0 });
  } else {
    const r = z === 1 ? 9 + Math.random() * 10 : 14 + Math.random() * 18;
    const pts = Array.from({ length: 9 }, (_, k) => ({ a: k / 9 * Math.PI * 2, d: r * (0.75 + Math.random() * 0.3) }));
    obs.push({ type: 'rock', x: Math.random() * W, y: -r, r: r * 0.85, vy: speed, rot: 0, vr: (Math.random() - 0.5) * 2, pts, ph: 0 });
  }
}
let bitT = 2;
function spawnBits() { // v10: a wavy trail of stardust to follow
  const bx = 70 + Math.random() * Math.max(1, W - 140), amp = Math.min(70, W * 0.15), ph = Math.random() * 6;
  for (let k = 0; k < 7; k++) obs.push({ type: 'bit', x: Math.max(24, Math.min(W - 24, bx + Math.sin(ph + k * 0.75) * amp)), y: -20 - k * 40, r: 9, vy: 150, ph: k });
}
function drawBit(o) {
  const s = o.r * (0.85 + 0.2 * Math.sin(o.ph * 6));
  ctx.save(); ctx.translate(o.x, o.y);
  dotAt(0, 0, s * 1.5, 'rgba(255, 246, 192, 0.25)');
  ctx.fillStyle = '#fff6c0'; ctx.beginPath();
  for (let k = 0; k < 8; k++) { const r = k % 2 ? s * 0.38 : s, a = k * Math.PI / 4; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function spawnSpecial(t) {
  if (t === 'storm') { G.storm = 6; G.stormT = 0; sfx('siren'); toast('☄️ COMET STORM! Dodge, dodge, dodge!', 3200); say('Comet storm! Dodge, dodge, dodge!'); return; } // v13
  const o = { type: t, x: 40 + Math.random() * (W - 80), y: -30, r: 16, vy: 110, ph: Math.random() * 6 };
  if (t === 'worm') { o.r = 26; o.vy = 85; }
  if (t === 'bh') { o.r = 16; o.vy = 65; }
  if (t === 'cop') { o.r = 26; o.vy = 160; o.life = 7; o.sirenT = 0; o.x = cat.x; toast('🚨 Space police! Do NOT boost!', 2800); say('Wee-woo! Space police! No boosting!'); } // v12
  if (t === 'pirate') { const left = Math.random() < 0.5; o.r = 32; o.vy = 0; o.vx = (left ? 1 : -1) * 120; o.x = left ? -60 : W + 60; o.by = H * 0.45; o.y = o.by; sfx('arr'); toast('🏴‍☠️ Space pirates! Dodge their ship!', 2600); }

let bhSeen = false;
function update(dt) {
  const bs = boosting() ? 1.8 : 1; // v10: boost makes everything rush past faster
  if (bs > 1 && !wasBoost) sfx('boost');
  wasBoost = bs > 1;
  const sp = state === 'fly' ? 120 * (bs > 1 ? 2.6 : 1) : 20;
  for (const s of starfield) { s.y += (sp * s.s * dt) / H; if (s.y > 1) { s.y = 0; s.x = Math.random(); } }

  if (state === 'fly') {
    const size = catSize(), mv = 340;
    if (keys.arrowleft || keys.a) cat.x -= mv * dt;
    if (keys.arrowright || keys.d) cat.x += mv * dt;
    if (keys.arrowup || keys.w) cat.y -= mv * dt;
    if (keys.arrowdown || keys.s) cat.y += mv * dt;
    if (pointerTarget) { const k = Math.min(1, dt * 9); cat.x += (pointerTarget.x - cat.x) * k; cat.y += (pointerTarget.y - cat.y) * k; }

    const z = ZONES.reduce((a, [at], k) => progress >= at ? k : a, 0);
    if (z !== zone) { zone = z; toast(ZONES[z][1], 2200); }
    spawnT -= dt;
    if (spawnT <= 0) { spawnObstacle(z); spawnT = SPAWN_GAP[z] * ROCKS[CFG.rocks] * (0.7 + Math.random() * 0.6); }
    while (specials.length && progress >= specials[0].at) spawnSpecial(specials.shift().t);
    fishT -= dt;
    bitT -= dt * bs;
    if (bitT <= 0) { spawnBits(); bitT = 3.2 + Math.random() * 2; }
    if (fishT <= 0) { obs.push({ type: 'fish', x: 30 + Math.random() * (W - 60), y: -20, r: 14, vy: 130, ph: 0 }); fishT = 6 + Math.random() * 3; }

    let caught = null; const fired = [];
    for (const o of obs) {
      o.y += o.vy * dt * bs;
      if (o.vx) o.x += o.vx * dt;
      o.ph += dt * (o.type === 'alien' ? 2.5 : 1);
      if (o.type === 'rock') o.rot += o.vr * dt;
      if (o.type === 'alien') o.x = o.bx + Math.sin(o.ph) * o.amp;
      if (o.type === 'bh') { // black holes pull you in
        const dx = o.x - cat.x, dy = o.y - cat.y, d = Math.hypot(dx, dy);
        if (d < 170 && d > 1) { const f = (170 - d) / 170 * 170 * dt; cat.x += dx / d * f; cat.y += dy / d * f; }
      }
      if (o.type === 'disc') { const near = o.y > cat.y - 60, k = Math.min(1, dt * (near ? 4 : 0.9)); o.x += (cat.x - o.x) * k; if (near) o.y += (cat.y - o.y) * k - o.vy * dt * bs; } // v12: the knowledge star comes to you, so it is never missed
      if (o.type === 'pirate') { // v13: pirates fire slow cannonballs at you
        o.y = o.by + Math.sin(o.ph * 2) * 40;
        o.fireT = (o.fireT ?? 0.9) - dt;

      if (CFG.char === 'platypus' && (o.type === 'bit' || o.type === 'gem' || o.type === 'fish')) { const dx = cat.x - o.x, dy = cat.y - o.y, d = Math.hypot(dx, dy); if (d < 190 && d > 1) { const f = Math.min(d, 280 * dt); o.x += dx / d * f; o.y += dy / d * f; } } // v13: electric sense pulls stardust in

        case 'cop': pullOver(o); return false;
        case 'pirate': { if (invuln <= 0) hit('🏴‍☠️ The pirate ship rammed you!'); const k = Math.min(5, G.bits); G.bits -= k; sfx('arr'); toast(k ? `🏴‍☠️ Arr! The pirates grabbed ${k} stardust!` : '🏴‍☠️ Arr! No stardust? The pirates sailed away!', 2600); say('Arrr! Shiny stardust for me!'); o.gone = true; invuln = Math.max(invuln, 1); return false; }
        case 'worm':

    progress = Math.min(1, progress + dt * bs / FLY_SECS[CFG.fly]);
    if (G.radio && G.radio.length && progress >= G.radioAt && state === 'fly') { showRadio(G.radio.shift()); G.radioAt = progress + 0.18; } // v12: colony radio news
    updateHud();

  } else if (state === 'arrive') {

  } else if (state === 'land') {

  }
}

}
function drawWorm(o) {

    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(o.x - 5, o.y - 1, 4, 0, Math.PI * 2); ctx.arc(o.x + 5, o.y - 1, 4, 0, Math.PI * 2); ctx.fill();

  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.ph);

  bubble(t < 2.2 ? `Landing on ${p.name}...` : !hasG ? 'No ground to land on! The ship has to hover.' : t < 2.8 ? 'Touchdown!' : 'Let\'s explore!');
  skipHint();
}
function drawBHToon(t) { // why time slows down near a black hole
  const m = Math.min(W, H), bx = W / 2, by = H * 0.47, a = t * 0.9;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(160, 190, 255, 0.35)'; ctx.lineWidth = 1.5; // space-time bends near the black hole
  for (let k = 1; k <= 4; k++) { ctx.beginPath(); ctx.ellipse(bx, by + k * m * 0.012, m * (0.1 + k * 0.07), m * (0.03 + k * 0.025), 0, 0, Math.PI * 2); ctx.stroke(); }
  ctx.save(); ctx.translate(bx, by); ctx.rotate(-0.3); ctx.strokeStyle = 'rgba(255, 170, 70, 0.9)'; ctx.lineWidth = m * 0.022; ctx.beginPath(); ctx.ellipse(0, 0, m * 0.15, m * 0.045, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(bx, by, m * 0.07, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255, 200, 120, 0.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(bx, by, m * 0.07 + 2, 0, Math.PI * 2); ctx.stroke();
  drawCat(bx + Math.cos(a) * m * 0.27, by + Math.sin(a) * m * 0.1, catSize() * 0.8, { flame: true, sy: 1.15 });
  const cr = Math.min(m * 0.085, 46), cy = H * 0.76;
  drawClock(W * 0.25, cy, cr, t * 0.5); drawClock(W * 0.75, cy, cr, t * 7);
  const fs = W < 420 ? 14 : 17;
  label('Your clock: slow', W * 0.25, cy + cr + 18, fs); label('Clock back home: fast', W * 0.75, cy + cr + 18, fs);
  bubble('A black hole\'s gravity is so strong that it stretches time!');
  skipHint();
}
function drawWormFlight(t) { // into the ball, through the tunnel, out in a new galaxy
  const d = toon.data, m = Math.min(W, H), cs = catSize();
  if (t < 2.2) {
    const k = t / 2.2;
    drawWormSphere(W / 2, H * 0.42, m * (0.12 + k * 0.3), t, d.planned);
    drawRocket(W / 2, H * (0.9 - k * 0.4), cs * (1.5 - k * 1.0), { flame: true });
    bubble('Into the wormhole! Hold on tight!');
  } else if (t < 7) {
    const wig = d.accident && t > 4.2 && t < 6.4;
    drawTunnel(t, wig);
    drawRocket(W / 2 + Math.sin(t * 2) * W * 0.06 + (wig ? Math.sin(t * 45) * 6 : 0), H * 0.62 + Math.cos(t * 1.7) * H * 0.03, cs * 1.1, { flame: true, rot: Math.sin(t * 2) * 0.25 + (wig ? Math.sin(t * 30) * 0.3 : 0) });
    bubble(wig ? 'Uh-oh! The wormhole is wiggling!' : t < 4.2 ? 'Wheee! A shortcut through space!' : 'Almost through...');
  } else {
    const k = Math.min(1, (t - 7) / 2), r = m * (0.16 + k * 0.16);
    drawGalaxy(W / 2, H * 0.44, r, d.g, t);
    label(d.g.name, W / 2, H * 0.44 + r * 0.75 + 26, 22);
    drawRocket(W / 2, H * (0.95 - k * 0.15), cs * 1.2, { flame: true });
    if (k < 0.5) { ctx.fillStyle = `rgba(255, 255, 255, ${1 - k * 2})`; ctx.fillRect(0, 0, W, H); }
    bubble(d.accident ? 'Oops! This is NOT where we were going!' : 'We made it to a new galaxy!');
  }
  skipHint();
}
function drawToon() { ({ takeoff: drawTakeoff, touchdown: drawTouchdown, blackhole: drawBHToon, worm: drawWormFlight, colony: drawColonyToon, police: drawPoliceToon, broke: drawBrokeToon, repair: drawRepairToon, tow: t => drawBrokeToon(t + 2.2), journey: drawJourneyToon })[toon.kind](toon.t); }

function drawWormStory(i, t) { // pictures for "How a wormhole works"
  const m = Math.min(W, H), skyH = H * 0.62;
  if (i === 0) {
    const y = skyH * 0.55, x1 = W * 0.17, x2 = W * 0.83, r = Math.min(m * 0.14, W * 0.13);
    drawGalaxy(x1, y, r, GALAXIES[0], t); drawGalaxy(x2, y, r, GALAXIES[1], t);
    label('Milky Way', x1, y + r + 16, 15); label('Andromeda', x2, y + r + 16, 15);
    ctx.setLineDash([6, 8]); ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x1 + r, y); ctx.lineTo(x2 - r, y); ctx.stroke(); ctx.setLineDash([]);
    label('2.5 million light-years', W / 2, y - 22, 15);
    drawRocket(x1 + r + 14 + Math.min(18, t * 1.2), y, 9, { flame: true, rot: Math.PI / 2, cat: false });
    label('So slow...', x1 + r + 30, y + 24, 13);
  } else if (i === 1) {
    const f0 = Math.max(0, Math.min(1, (t - 1) / 2.2)), f = f0 * f0 * (3 - 2 * f0);
    const xl = W * 0.3, xr = W * 0.62, yT = skyH * 0.36, yB = skyH * 0.78, R = (yB - yT) / 2, yF = skyH * 0.6;
    const pt = s => {
      let fx, fy;
      if (s < 0.4) { fx = xl + (xr - xl) * s / 0.4; fy = yT; }
      else if (s < 0.6) { const a = (s - 0.4) / 0.2 * Math.PI; fx = xr + Math.sin(a) * R; fy = yT + R - Math.cos(a) * R; }
      else { fx = xr - (xr - xl) * (s - 0.6) / 0.4; fy = yB; }
      const px = W * 0.12 + s * W * 0.76;
      return [px + (fx - px) * f, yF + (fy - yF) * f];
    };
    ctx.strokeStyle = '#bfe3ff'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
    for (let s = 0; s <= 1.0001; s += 0.02) { const [px, py] = pt(s); s ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.stroke();
    const A = pt(0.1), B = pt(0.9);
    if (f >= 1) {
      ctx.strokeStyle = 'rgba(170, 120, 255, 0.75)'; ctx.lineWidth = 20; ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
      const k = ((t - 3.2) % 1.6) / 1.6; drawRocket(A[0], A[1] + (B[1] - A[1]) * k, 8, { flame: true, rot: Math.PI, cat: false });
      label('Shortcut!', A[0] - 62, (A[1] + B[1]) / 2, 16);
    } else if (f === 0) label('The long way', W / 2, yF - 24, 16);
    ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.arc(A[0], A[1], 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7be07b'; ctx.beginPath(); ctx.arc(B[0], B[1], 9, 0, Math.PI * 2); ctx.fill();
    label('Here', A[0], A[1] - 22, 15); label('There', B[0], B[1] + 22, 15);
  } else if (i === 2) {
    drawWormSphere(W / 2, skyH * 0.56, m * 0.2, t, GALAXIES[1]);
    drawRocket(W * 0.2, skyH * 0.8, 16, { flame: true, rot: 1.0 });
  } else {
    drawWormSphere(W * 0.68, skyH * 0.5, m * 0.17, t, GALAXIES[1]);
    drawRocket(W * 0.28 + Math.sin(t * 2) * 4, skyH * 0.62, 20, { flame: true, rot: 1.2 });
    label('Made up!', W * 0.68, skyH * 0.5 + m * 0.17 + 30, 16);
  }
}

function drawMoonBase() {
  ctx.fillStyle = '#9a96a8'; ctx.beginPath(); ctx.ellipse(W / 2, H * 1.15, W * 0.9, H * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#7d7990'; for (const [dx, dy, r] of [[-0.3, 0.92, 18], [0.25, 0.95, 12], [0.05, 0.9, 9]]) { ctx.beginPath(); ctx.ellipse(W / 2 + dx * W, H * dy, r * 1.6, r * 0.6, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = 'rgba(190, 230, 255, 0.35)'; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W * 0.22, H * 0.9, 50, Math.PI, 0); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(W * 0.8, H * 0.9, 34, Math.PI, 0); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#4a7bd0'; ctx.beginPath(); ctx.arc(W * 0.85, H * 0.15, 26, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6fae4a'; ctx.beginPath(); ctx.ellipse(W * 0.84, H * 0.14, 10, 7, 0.5, 0, Math.PI * 2); ctx.fill();
}

function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, SKY[CFG.sky][0]); g.addColorStop(1, SKY[CFG.sky][1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  const streak = boosting() ? 12 : 1; // v10: the stars turn into streaks while boosting
  for (let k = 0; k < STAR_COUNT[CFG.stars]; k++) { const s = starfield[k]; ctx.globalAlpha = 0.4 + s.s * 0.3; ctx.fillRect(s.x * W, s.y * H, s.s, s.s * streak); }
  ctx.globalAlpha = 1;

  if (state === 'fly' || state === 'arrive' || state === 'fact' || state === 'quiz') {
    const p = G.planets[dest], flying = state !== 'arrive';
    const r = flying ? 10 + progress * 30 : 40 + animT * H * 0.25;
    const py = flying ? ribH + 50 + r : ribH + 80 + animT * H * 0.12;
    drawPlanet(p, W / 2, py, r);
    for (const o of obs) ({ rock: drawRock, alien: drawAlien, fish: drawFish, can: drawCan, comet: drawComet, worm: drawWorm, bh: drawBH, mimic: drawMimic, disc: drawDisc, gem: drawGem, bit: drawBit, cop: drawCop, pirate: drawPirateShip, ball: drawBall })[o.type](o);
    if (G.storm > 0) { ctx.fillStyle = `rgba(255, 120, 60, ${0.08 + 0.05 * Math.sin(performance.now() / 120)})`; ctx.fillRect(0, 0, W, H); } // v13: the sky glows during a comet storm
    const size = catSize();
    const blink = invuln > 0 && Math.floor(invuln * 10) % 2 === 0;
    if (!blink) {
      if (shield > 0 && flying) {
        ctx.strokeStyle = `rgba(124, 200, 255, ${0.25 + 0.2 * shield})`; ctx.lineWidth = 1 + shield * 1.2;
        ctx.beginPath(); ctx.arc(cat.x, cat.y, size * 1.15, 0, Math.PI * 2); ctx.stroke();
      }
      drawCat(cat.x, cat.y, size, { flame: true, big: boosting() });
    }
    if (state === 'fact') drawFact();
  } else if (state === 'toon' && toon) {
    drawToon();
  } else if (state === 'story') {
    if (storyMode === 'worm') drawWormStory(storyIdx, animT); else drawStory(storyIdx, animT);
  } else if (state === 'rove') {
    drawRove();
  } else if (state === 'land') {
    drawScene();
  } else {
    drawMoonBase();
    drawCat(W / 2, H * 0.78 + Math.sin(performance.now() / 600) * 8, catSize() * 1.3, { flame: true });
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  if (rankIdx) drawRank(dt);
  if (cardToon) drawCard(dt);
  boostEl.classList.toggle('hidden', state !== 'fly'); boostEl.classList.toggle('on', boosting());
  updateRibbon();
  requestAnimationFrame(loop);
}
titleScreen();
updateRibbon();
loadSave().then(() => { applyDesign(); if (state === 'title') titleScreen(); });
requestAnimationFrame(loop);
</script>
